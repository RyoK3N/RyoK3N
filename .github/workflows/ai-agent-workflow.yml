name: 🤖 AI Agent Workflow (GitHub Pages Blog)

on:
  schedule:
    # Run weekly on Sunday at midnight UTC
    - cron: '0 0 * * 0'
  
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug mode'
        required: false
        default: 'false'
      skip_blog:
        description: 'Skip blog generation'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  ai-agent-enhanced:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🔄 Pull Latest Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "AI Agent Bot"
          git pull origin ${{ github.ref_name }} --rebase || true
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/ai_agent/requirements.txt
          pip list
      
      - name: 🔍 Step 1 - Analyze Repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEBUG_MODE: ${{ github.event.inputs.debug || 'false' }}
        run: |
          echo "::group::Repository Analysis"
          python scripts/ai_agent/analyze_repository.py
          echo "::endgroup::"

      - name: Deep Code Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Deep Code Analysis"
          python scripts/ai_agent/analyze_code.py
          echo "::endgroup::"
      
      - name: 🔬 Step 2A - Deep Code Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::group::Deep Code Analysis"
          python scripts/ai_agent/analyze_code.py
          echo "::endgroup::"
      
      - name: 🎯 Step 2 - Categorize Projects
        env:
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_API_KEY }}
        run: |
          echo "::group::Project Categorization"
          python scripts/ai_agent/categorize_projects.py
          echo "::endgroup::"
      
      - name: 🕸️ Step 3 - Generate Knowledge Graph
        run: |
          echo "::group::Knowledge Graph Generation"
          python scripts/ai_agent/generate_knowledge_graph.py
          echo "::endgroup::"
      
      - name: ⭐ Step 4 - Select Featured Project
        env:
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_API_KEY }}
        run: |
          echo "::group::Featured Project Selection"
          python scripts/ai_agent/select_featured_project.py
          echo "::endgroup::"
      
      - name: 📝 Step 5 - Generate Blog Post
        if: github.event.inputs.skip_blog != 'true'
        env:
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_API_KEY }}
        run: |
          echo "::group::Blog Post Generation"
          python scripts/ai_agent/generate_blog.py
          echo "::endgroup::"
      
      - name: 📄 Step 6 - Generate Blog Pages
        if: github.event.inputs.skip_blog != 'true'
        run: |
          echo "::group::Blog Page Generation"
          python scripts/ai_agent/generate_blog_page.py
          echo "::endgroup::"
      
      - name: 📡 Step 7 - Generate RSS Feed
        if: github.event.inputs.skip_blog != 'true'
        run: |
          echo "::group::RSS Feed Generation"
          python scripts/ai_agent/generate_rss.py
          echo "::endgroup::"
      
      - name: ✍️ Step 8 - Update README
        run: |
          echo "::group::README Update"
          python scripts/ai_agent/update_readme.py
          echo "::endgroup::"
      
      - name: 📊 List Generated Files
        run: |
          echo "=== Generated Data Files ==="
          ls -lh scripts/ai_agent/data/ || echo "No data directory"
          echo ""
          echo "=== Generated Blog Files ==="
          ls -lh docs/ || echo "No docs directory"
          ls -lh docs/blog/ || echo "No blog directory"
      
      - name: 💾 Commit Changes
        run: |
          git pull origin ${{ github.ref_name }} --rebase || true
          
          # Add all changed files
          git add README.md || true
          git add docs/ || true
          git add scripts/ai_agent/data/*.json || true
          
          # Check for changes
          if git diff --staged --quiet; then
            echo "ℹ️  No changes to commit"
            echo "has_changes=false" >> $GITHUB_ENV
          else
            echo "✅ Changes detected, committing..."
            
            git commit -m "🤖 AI Agent: Weekly update with blog & knowledge graph

            ✨ Features updated:
            - 🧠 AI-categorized project knowledge graph
            - ⭐ Featured project of the week
            - 📝 New blog post (auto-generated)
            - 📡 Updated RSS feed
            - 📊 Interactive visualizations
            
            Generated by: ${{ github.workflow }}
            Run: #${{ github.run_number }}
            Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            
            echo "has_changes=true" >> $GITHUB_ENV
          fi
      
      - name: 🚀 Push Changes
        if: env.has_changes == 'true'
        run: |
          max_attempts=3
          attempt=1
          
          until git push origin ${{ github.ref_name }} || [ $attempt -eq $max_attempts ]; do
            echo "⚠️  Push failed, retrying... (attempt $attempt/$max_attempts)"
            git pull origin ${{ github.ref_name }} --rebase
            attempt=$((attempt + 1))
            sleep 5
          done
          
          if [ $attempt -le $max_attempts ]; then
            echo "✅ Changes pushed successfully"
          else
            echo "❌ Failed to push after $max_attempts attempts"
            exit 1
          fi
      
      - name: 📈 Deploy to GitHub Pages
        if: env.has_changes == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          enable_jekyll: false
          cname: false
      
      - name: 📊 Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-agent-output-${{ github.run_number }}
          path: |
            scripts/ai_agent/data/*.json
            docs/**/*.html
            docs/feed.xml
          retention-days: 30
          if-no-files-found: warn
      
      - name: 🎉 Workflow Summary
        if: always()
        run: |
          echo "## 🤖 AI Agent Workflow Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow**: ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Number**: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### ✨ Features Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- [x] 🧠 AI-powered project categorization" >> $GITHUB_STEP_SUMMARY
          echo "- [x] 🕸️ Interactive knowledge graph" >> $GITHUB_STEP_SUMMARY
          echo "- [x] ⭐ Featured project selection" >> $GITHUB_STEP_SUMMARY
          echo "- [x] 📝 Automated blog generation" >> $GITHUB_STEP_SUMMARY
          echo "- [x] 📡 RSS feed for subscribers" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "docs/knowledge-graph.html" ]; then
            echo "### 🔗 Live Links" >> $GITHUB_STEP_SUMMARY
            echo "- 🌐 [Blog Homepage](https://ryok3n.github.io/RyoK3N/)" >> $GITHUB_STEP_SUMMARY
            echo "- 🕸️ [Knowledge Graph](https://ryok3n.github.io/RyoK3N/knowledge-graph.html)" >> $GITHUB_STEP_SUMMARY
            echo "- 📡 [RSS Feed](https://ryok3n.github.io/RyoK3N/feed.xml)" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📁 Generated Files" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "docs/blog" ]; then
            POST_COUNT=$(ls -1 docs/blog/*.html 2>/dev/null | wc -l)
            echo "- 📝 Blog Posts: $POST_COUNT" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "scripts/ai_agent/data/blog_history.json" ]; then
            echo "- ✅ Blog history updated" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f "docs/feed.xml" ]; then
            echo "- ✅ RSS feed generated" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*🤖 Powered by Hugging Face AI • Deployed to GitHub Pages*" >> $GITHUB_STEP_SUMMARY

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: ai-agent-enhanced
    if: failure()
    
    steps:
      - name: 🚨 Create Issue on Failure
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🤖 AI Agent Workflow Failed',
              body: `## Workflow Failure Report
              
              The AI Agent workflow has failed. Please investigate.
              
              **Details:**
              - **Workflow**: ${context.workflow}
              - **Run ID**: ${context.runId}
              - **Run Number**: ${context.runNumber}
              - **Event**: ${context.eventName}
              - **Timestamp**: ${new Date().toISOString()}
              
              **Quick Links:**
              - [View Workflow Run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
              - [View Logs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/logs)
              
              ---
              *This issue was automatically created by the AI Agent Bot*`,
              labels: ['bug', 'automation', 'ai-agent']
            });
            console.log('Created issue:', issue.data.number);
