name: 🤖 AI Agent Workflow (Enhanced)

on:
  schedule:
    # Run daily at midnight UTC
    - cron: '0 0 * * *'
  
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug mode'
        required: false
        default: 'false'
      skip_blog:
        description: 'Skip blog generation'
        required: false
        default: 'false'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  ai-agent-enhanced:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🔄 Pull Latest Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "AI Agent Bot"
          git pull origin ${{ github.ref_name }} --rebase
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/ai_agent/requirements.txt
      
      - name: 🔍 Analyze Repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          DEBUG_MODE: ${{ github.event.inputs.debug || 'false' }}
        run: |
          python scripts/ai_agent/analyze_repository.py
      
      - name: 🎯 Categorize Projects
        env:
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
        run: |
          python scripts/ai_agent/categorize_projects.py
      
      - name: 🕸️ Generate Knowledge Graph
        run: |
          python scripts/ai_agent/generate_knowledge_graph.py
      
      - name: ⭐ Select Featured Project
        env:
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
        run: |
          python scripts/ai_agent/select_featured_project.py
      
      - name: 📝 Generate Blog Post
        if: github.event.inputs.skip_blog != 'true'
        env:
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
        run: |
          python scripts/ai_agent/generate_blog.py
      
      - name: 📤 Publish to Ghost CMS
        if: github.event.inputs.skip_blog != 'true'
        env:
          GHOST_ADMIN_API_KEY: ${{ secrets.GHOST_ADMIN_API_KEY }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
        run: |
          python scripts/ai_agent/publish_to_ghost.py
      
      - name: ✍️ Update README
        run: |
          python scripts/ai_agent/update_readme.py
      
      - name: 💾 Commit Changes
        run: |
          git pull origin ${{ github.ref_name }} --rebase || true
          
          git add README.md
          git add assets/knowledge_graph.html || true
          git add scripts/ai_agent/data/*.json || true
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 AI Agent: Enhanced weekly update

            ✨ Features updated:
            - 🧠 Project categorization and knowledge graph
            - ⭐ Featured project of the week
            - 📝 Auto-generated tech blog post
            - 📊 Interactive visualizations
            
            Generated by: ${{ github.workflow }}
            Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            
            # Push with retry
            max_attempts=3
            attempt=1
            until git push origin ${{ github.ref_name }} || [ $attempt -eq $max_attempts ]; do
              echo "⚠️  Push failed, retrying... (attempt $attempt/$max_attempts)"
              git pull origin ${{ github.ref_name }} --rebase
              attempt=$((attempt + 1))
              sleep 5
            done
            
            echo "✅ Changes committed and pushed"
          fi
      
      - name: 📈 Deploy Knowledge Graph to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./assets
          publish_branch: gh-pages
          keep_files: true
      
      - name: 📊 Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-agent-output-${{ github.run_number }}
          path: |
            scripts/ai_agent/data/*.json
            assets/knowledge_graph.html
          retention-days: 30
      
      - name: 🎉 Workflow Summary
        if: always()
        run: |
          echo "## 🤖 AI Agent Enhanced Workflow Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✨ Features Deployed" >> $GITHUB_STEP_SUMMARY
          echo "- [x] 🧠 AI-powered project categorization" >> $GITHUB_STEP_SUMMARY
          echo "- [x] 🕸️ Interactive knowledge graph" >> $GITHUB_STEP_SUMMARY
          echo "- [x] ⭐ Featured project selection" >> $GITHUB_STEP_SUMMARY
          echo "- [x] 📝 Automated blog generation" >> $GITHUB_STEP_SUMMARY
          echo "- [x] 📤 Ghost CMS publication" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Quick Links" >> $GITHUB_STEP_SUMMARY
          echo "- [Knowledge Graph](https://ryok3n.github.io/RyoK3N/knowledge_graph.html)" >> $GITHUB_STEP_SUMMARY
          echo "- [Blog](https://synexian.ghost.io)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')*" >> $GITHUB_STEP_SUMMARY
