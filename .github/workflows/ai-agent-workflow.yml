name: 🤖 AI Agent Workflow

on:
  # Run daily at midnight UTC
  schedule:
    - cron: '0 0 * * *'
  
  # Allow manual trigger
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug mode'
        required: false
        default: 'false'
  
  # Run on push to main (optional - can be removed)
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ai-agent-workflow.yml'
      - 'scripts/ai_agent/**'

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  ai-agent-analysis:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for comprehensive analysis
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/ai_agent/requirements.txt
      
      - name: 🔍 Run Repository Analysis
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          REPOSITORY: ${{ github.repository }}
          DEBUG_MODE: ${{ github.event.inputs.debug || 'false' }}
        run: |
          python scripts/ai_agent/analyze_repository.py
      
      - name: 🧠 Generate AI Insights
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_API_KEY: ${{ secrets.HF_API_KEY }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/ai_agent/generate_insights.py
      
      - name: ✍️ Update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/ai_agent/update_readme.py
      
      - name: 📊 Generate Performance Metrics
        run: |
          python scripts/ai_agent/generate_metrics.py
      
      - name: 💾 Commit Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "AI Agent Bot"
          
          # Add all changed files
          git add README.md
          git add scripts/ai_agent/data/*.json
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 AI Agent: Automated daily update [skip ci]
            
            - Updated repository insights
            - Generated AI-powered analysis
            - Refreshed metrics and statistics
            
            Generated by: ${{ github.workflow }}
            Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            
            git push
            echo "✅ Changes committed and pushed successfully"
          fi
      
      - name: 📈 Upload Analysis Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-agent-analysis-${{ github.run_number }}
          path: |
            scripts/ai_agent/data/*.json
            scripts/ai_agent/logs/*.log
          retention-days: 30
      
      - name: 🎉 Workflow Summary
        if: always()
        run: |
          echo "## 🤖 AI Agent Workflow Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Execution Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow**: ${{ github.workflow }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Number**: #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Repository**: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Tasks Completed" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Repository analysis" >> $GITHUB_STEP_SUMMARY
          echo "- [x] AI insights generation" >> $GITHUB_STEP_SUMMARY
          echo "- [x] README update" >> $GITHUB_STEP_SUMMARY
          echo "- [x] Metrics generation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*🤖 Powered by Hugging Face AI*" >> $GITHUB_STEP_SUMMARY

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: ai-agent-analysis
    if: failure()
    
    steps:
      - name: 🚨 Create Issue on Failure
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🤖 AI Agent Workflow Failed',
              body: `## Workflow Failure Report
              
              The AI Agent workflow has failed. Please investigate.
              
              **Details:**
              - **Workflow**: ${context.workflow}
              - **Run ID**: ${context.runId}
              - **Run Number**: ${context.runNumber}
              - **Timestamp**: ${new Date().toISOString()}
              
              [View Workflow Run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
              
              ---
              *This issue was automatically created by the AI Agent Bot*`,
              labels: ['bug', 'automation', 'ai-agent']
            });
            console.log('Created issue:', issue.data.number);
